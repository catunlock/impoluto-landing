<!doctype html>
<!-- Template for public/og.png (1200x630). Open it in a browser at that size and take a screenshot,
     or see README.md. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Inter; src: url('../public/fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { font-family: Inter, sans-serif; background: linear-gradient(180deg, #dfeafc 0%, #edf2fb 55%, #f6f3ea 100%); color: #141924; position: relative; }
.sun { position: absolute; width: 420px; height: 420px; left: 330px; top: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,201,77,.5), rgba(255,201,77,0) 68%); }
.copy { position: absolute; left: 72px; top: 92px; width: 520px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 720; letter-spacing: -0.02em; }
.brand img { width: 56px; height: 56px; border-radius: 13px; }
h1 { margin: 46px 0 0; font-size: 64px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 760; }
p { margin: 24px 0 0; font-size: 25px; line-height: 1.4; color: #5d6573; }
.shot { position: absolute; left: 640px; top: 120px; width: 700px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -12px rgba(23,45,90,.3); border: 1px solid rgba(20,25,36,.08); background: #fff; }
.shot img { display: block; width: 100%; }
.phone { position: absolute; left: 600px; top: 250px; width: 170px; padding: 7px; background: #1a1e27; border-radius: 28px; box-shadow: 0 30px 60px -12px rgba(23,45,90,.35); }
.phone img { display: block; width: 100%; border-radius: 22px; }
</style></head><body>
<div class="sun"></div>
<div class="copy">
  <div class="brand"><img src="../public/img/mark.png" alt="">Impoluto</div>
  <h1>A spotless home, without the arguments.</h1>
  <p>Your home as a 3D map, with the chores shared fairly.</p>
</div>
<div class="shot"><img src="../public/img/map-desktop.webp" alt=""></div>
<div class="phone"><img src="../public/img/today-phone.webp" alt=""></div>
</body></html>
